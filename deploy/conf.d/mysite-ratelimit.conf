# 登录接口限速(nginx 层,基于真实 TCP 对端 IP,无法用 X-Forwarded-For 伪造)
# 本文件放在 /etc/nginx/conf.d/ 下,该目录被 include 进 http 上下文,可定义 zone。
limit_req_zone $binary_remote_addr zone=mysite_login:10m rate=10r/m;

# 验证码图片限速:正常用户几十秒才点一次,给 30 次/分钟足够宽松
limit_req_zone $binary_remote_addr zone=mysite_captcha:10m rate=30r/m;

limit_req_status 429;
