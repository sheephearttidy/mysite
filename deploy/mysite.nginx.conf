# ============================================================
# imyxj.xyz — Flask 模板前台 + Flask 后台
# 安全加固版:
#   - X-Forwarded-For 改为 $remote_addr 覆盖(客户端伪造无效)
#   - 登录接口在 nginx 层限速(10 次/分钟/IP,基于真实 TCP 源)
#   - 全站安全响应头 + 隐藏 nginx 版本
#   - 关闭目录列表
#
# v2.6:前台 7 页改为 Flask + Jinja 渲染,location / 反代到 5100。
#   CSP 由 Flask 按请求生成(带 per-request nonce),所以所有走 Flask 的
#   location 必须 include mysite-headers-nocsp.conf;nginx 若再发一份
#   无 nonce 的 CSP,浏览器取交集会把带 nonce 的内联脚本全部拦掉
#   (v2.4 踩过:后台面板全空、侧边栏计数全 0)。
# ============================================================

server {
    server_name imyxj.xyz www.imyxj.xyz;

    root /var/www/mysite;

    server_tokens off;
    autoindex off;

    # 请求体上限:普通请求 64KB,图片上传接口单独放宽(见下)
    client_max_body_size 64k;

    # ---- 后台管理系统(Flask) ----
    location = /admin { return 301 /admin/; }

    # 登录 POST 单独限速
    location = /admin/login {
        limit_req zone=mysite_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:5100/admin/login;
        proxy_set_header Host $host;
        # 覆盖而非追加:客户端自带的 X-Forwarded-For 会被丢弃
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    # 验证码图片:同样限速,防止被脚本批量刷
    location = /admin/captcha.svg {
        limit_req zone=mysite_captcha burst=10 nodelay;

        proxy_pass http://127.0.0.1:5100/admin/captcha.svg;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    }

    # 图片上传:仅此接口放宽体积
    location = /api/upload {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:5100/api/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    # 上传的图片由 nginx 静态直出,不经过 Flask
    location ^~ /assets/uploads/ {
        expires 30d;
        add_header Cache-Control 'public';
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    # 后台静态资源(CSS/JS):走反代到 Flask,带版本号可长缓存
    location ^~ /admin/static/ {
        proxy_pass http://127.0.0.1:5100/admin/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
        expires 7d;
        add_header Cache-Control 'public, max-age=604800';
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:5100/admin/;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    # ---- 前台 Jinja 页面与 Flask 路由 ----
    # 页面由 Flask 渲染(CSP 带 nonce 由 Flask 下发),故用 nocsp 版本。
    # 注意:旧的 location ~* \.html$ 静态块必须去掉,否则它会抢在
    # location / 之前去磁盘找 .html 文件,而这些文件已随 v2.6 删除。
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers-nocsp.conf;
    }

    # SEO 文件:短缓存,改了能马上生效
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control 'public, max-age=3600';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 静态资源直出(仍由 nginx 提供,比走 Flask 快),靠 ?v= 内容哈希破缓存
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control 'public';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 隐藏文件 / 备份 / 数据库一律拒绝
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sql|py|env|bak|log|ini)$ { deny all; }

    # ---- v2.7.4 性能优化 ----
    # gzip:补上 application/json(API 响应之前完全没压缩)、字体、SVG;
    # 提高压缩级别到 6(默认 1,CPU 换带宽很划算),并开 vary 让 CDN/代理正确区分。
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml
        image/svg+xml font/woff font/woff2;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2 on;   # v2.7.4:nginx 1.25+ 用独立指令,listen 里带 http2 已废弃
    ssl_certificate /etc/letsencrypt/live/imyxj.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/imyxj.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = imyxj.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name imyxj.xyz www.imyxj.xyz;
    return 404; # managed by Certbot
}
