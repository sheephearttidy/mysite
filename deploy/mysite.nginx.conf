# ============================================================
# imyxj.xyz — 静态主页 + Flask 后台
# 安全加固版:
#   - X-Forwarded-For 改为 $remote_addr 覆盖(客户端伪造无效)
#   - 登录接口在 nginx 层限速(10 次/分钟/IP,基于真实 TCP 源)
#   - 全站安全响应头 + 隐藏 nginx 版本
#   - 关闭目录列表
# ============================================================

server {
    server_name imyxj.xyz www.imyxj.xyz;

    root /var/www/mysite;
    index index.html;

    server_tokens off;
    autoindex off;

    # 请求体上限(后台 API 只收 JSON,64KB 足够)
    client_max_body_size 64k;

    # ---- 后台管理系统(Flask) ----
    location = /admin { return 301 /admin/; }

    # 登录 POST 单独限速
    location = /admin/login {
        limit_req zone=mysite_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:5100/admin/login;
        proxy_set_header Host $host;
        # 覆盖而非追加:客户端自带的 X-Forwarded-For 会被丢弃
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:5100/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # ---- 静态站 ----
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control 'public';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 隐藏文件 / 备份 / 数据库一律拒绝
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sql|py|env|bak|log|ini)$ { deny all; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/imyxj.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/imyxj.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = imyxj.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name imyxj.xyz www.imyxj.xyz;
    return 404; # managed by Certbot
}
