# 通用安全响应头 —— 前台静态页用(含 CSP)
# 注意:nginx 的 add_header 不会被子级 location 继承(子级一旦有 add_header 就全丢),
# 所以每个返回内容的 location 都要 include 本文件。
#
# v2.4 重要:/admin/ 与 /api/ 必须改用 mysite-headers-nocsp.conf!
# 后台 CSP 由 Flask(app.py)按请求动态生成并带 nonce;nginx 若再发一份,
# 浏览器会对多条 CSP 取交集,那份没有 nonce 的会把带 nonce 的内联脚本全拦掉,
# 表现:后台侧边栏计数全 0、面板全空,但留言板(单独拉取)正常。
#
# v2.4:加 frame-src 放行 QQ 音乐官方播放器(关于我页「最近在听」)。
# 注意 frame-src 不写会回退到 default-src 'self',iframe 直接被拦。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# v2.3:前台静态页 CSP(纯静态+Google Fonts,脚本全外链;风格需 unsafe-inline)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://i.y.qq.com https://y.qq.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
