# 通用安全响应头 —— 前台静态资源用(含 CSP)
#
# 注意:nginx 的 add_header 不会被子级 location 继承
# (子级一旦有 add_header 就全丢),所以每个返回内容的 location 都要 include 本文件。
#
# v5.2:前后台都是 React SPA,不再有服务端动态 nonce,
# 所以 CSP 可以统一静态下发,不用再分 nocsp 版本。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# v5.2 统一 CSP:
# - script-src 'self'      脚本全部外链(防闪烁脚本已抽成 theme-init.js)
# - style-src unsafe-inline React 内联样式需要
# - frame-src QQ 音乐      关于我页「最近在听」播放器
# - frame-ancestors 'none' 禁止被任何站点 iframe 嵌套
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src https://i.y.qq.com https://y.qq.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
