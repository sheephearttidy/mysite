# 通用安全响应头 —— 后台 /admin/ 与 /api/ 用(不含 CSP)
#
# v2.4 为什么单独一份:
# CSP 由 Flask(app.py)按请求动态生成并带 per-request nonce。
# 如果 nginx 也 add_header 一份 CSP,浏览器会对多条 CSP 取交集,
# 那份没有 nonce 的 script-src 'self' 会把带 nonce 的内联脚本全部拦掉,
# 表现就是:后台外链 JS 正常(留言板计数 2),但内联数据脚本被拦 →
# window.__ADMIN_DATA__ 为空 → renderAll() 第一行抛错 →
# 侧边栏所有计数停在 0、内容管理各面板全空(v2.4 踩过这个坑)。
#
# 所以后台/接口只发通用头,不重复发 CSP。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
