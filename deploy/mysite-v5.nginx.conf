# ============================================================
# imyxj.xyz — React SPA + FastAPI(v5.2)
#
# 与旧版差异:
#   - 前台不再由 Flask 渲染,改为 nginx 直出 dist/ 静态文件
#   - /api 反代到 FastAPI(5200)
#   - SPA 深链回退:try_files $uri /index.html
# ============================================================

server {
    server_name imyxj.xyz www.imyxj.xyz;

    root /var/www/mysite/dist;
    index index.html;

    server_tokens off;
    autoindex off;

    client_max_body_size 64k;

    # ---- API:反代到 FastAPI ----
    location /api/ {
        proxy_pass http://127.0.0.1:5200/api/;
        proxy_set_header Host $host;
        # 覆盖而非追加:客户端伪造的 X-Forwarded-For 无效
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 登录接口限速(基于真实 TCP 源)
    location = /api/login {
        limit_req zone=mysite_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5200/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 验证码:不限速但禁缓存
    location = /api/captcha.svg {
        proxy_pass http://127.0.0.1:5200/api/captcha.svg;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 图片上传放宽体积
    location = /api/admin/upload {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:5200/api/admin/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 上传的图片:nginx 静态直出
    location ^~ /assets/uploads/ {
        alias /var/www/mysite/assets/uploads/;
        expires 30d;
        add_header Cache-Control 'public';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 静态资源:带 hash 的文件可长缓存
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control 'public';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 后台入口
    location = /admin {
        return 302 /admin.html;
    }
    location = /admin/ {
        return 302 /admin.html;
    }

    # HTML 不缓存,保证发版即时生效
    location ~* \.html$ {
        add_header Cache-Control 'no-cache, must-revalidate';
        try_files $uri =404;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # SEO 文件
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control 'public, max-age=3600';
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # SPA 深链回退
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/mysite-headers.conf;
    }

    # 隐藏文件与敏感后缀一律拒绝
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sql|py|env|bak|log|ini)$ { deny all; }

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml
        image/svg+xml font/woff font/woff2;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/imyxj.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/imyxj.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = imyxj.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name imyxj.xyz www.imyxj.xyz;
    return 404; # managed by Certbot
}
