<!-- ================= 来访地图 ================= -->
<section id="map" class="sec-yellow page-head">
  <div class="container">
    <div class="map-head reveal">
      <span class="sticker">📍 访客贴纸墙</span>
      <h2>谁来过我的小窝<span class="wave-hand"> 🗺️</span></h2>
      <p>每一只来过的陌生人都会变成一颗小星星,钉在他所在的城市上。<br>被访问 <b id="mapTotal">0</b> 座城市的星星点亮(づ￣ ³￣)づ</p>
    </div>

    <div class="map-card reveal">
      <svg id="worldMap" viewBox="0 0 1000 520" role="img" aria-label="访客世界地图" class="world-map">
        <!-- 海洋网格背景 -->
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.08" />
          </pattern>
        </defs>
        <rect width="1000" height="520" fill="url(#grid)" class="map-sea" />

        <!-- 简化大陆轮廓(低多边形风,等距圆柱投影 1000x520) -->
        <g class="map-land" fill="currentColor" opacity="0.14">
          <!-- 亚洲+中国主体 -->
          <path d="M330 150 L370 140 L410 148 L440 160 L470 150 L505 162 L530 175 L520 195 L560 205 L575 228 L560 245 L575 262 L560 275 L545 262 L525 270 L510 290 L492 300 L470 292 L450 305 L430 298 L420 315 L400 310 L390 292 L375 298 L365 280 L350 285 L340 268 L350 252 L338 235 L345 218 L330 205 L322 190 Z" />
          <!-- 印度 -->
          <path d="M470 292 L492 300 L500 330 L488 360 L472 348 L462 320 L452 305 Z" />
          <!-- 东南亚 -->
          <path d="M525 270 L545 262 L558 285 L548 305 L530 298 L520 285 Z" />
          <!-- 中东 -->
          <path d="M420 210 L452 205 L460 225 L445 245 L430 240 L418 228 Z" />
          <!-- 非洲 -->
          <path d="M400 280 L430 272 L445 290 L455 310 L440 350 L420 400 L405 430 L388 410 L382 370 L388 340 L395 315 Z" />
          <!-- 欧洲 -->
          <path d="M360 130 L395 118 L420 130 L425 155 L410 170 L395 162 L380 172 L368 155 L352 148 Z" />
          <!-- 北美 -->
          <path d="M80 90 L130 78 L175 90 L210 105 L225 135 L210 160 L230 180 L225 205 L200 215 L180 235 L160 225 L150 200 L120 195 L95 175 L75 140 Z" />
          <!-- 南美 -->
          <path d="M205 260 L235 250 L255 275 L260 310 L250 355 L235 395 L215 405 L200 380 L195 340 L200 300 Z" />
          <!-- 澳洲 -->
          <path d="M770 360 L805 348 L840 360 L850 385 L835 405 L800 415 L775 400 L760 385 Z" />
        </g>

        <!-- 星星由 JS 动态插入 -->
        <g id="mapStars"></g>
      </svg>

      <div class="map-side">
        <h3>🌍 点亮过的城市</h3>
        <ul id="cityList" class="city-list">
          <li class="city-empty">还没有星星落地,快来做第一颗 ✨</li>
        </ul>
      </div>
    </div>
