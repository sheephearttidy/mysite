<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 我的小窝后台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ asset_ver }}" />
</head>
<body>
<span class="doodle d1">✨</span><span class="doodle d2">🔒</span>
<span class="doodle d3">⭐</span><span class="doodle d4">💫</span>

<div class="card">
  <div class="lock">🔐</div>
  <h1>我的小窝 · 后台</h1>
  <p class="sub">只有主人才能进来的神秘领域</p>
  {% if get_flashed_messages() %}
  <div class="err{% if '分钟后再来' in get_flashed_messages()[0] %} blocked{% endif %}">
    {{ get_flashed_messages()[0] }}
  </div>
  {% endif %}
  {% if initial %}
  <div class="tip">
    🌱 首次使用:初始密码是 <b>admin</b>,<br />登录后会提醒你马上修改
  </div>
  {% endif %}
  <form method="post" id="loginForm">
    <label for="password">暗号(密码)</label>
    <input type="password" id="password" name="password" required
           {% if not captcha_on %}autofocus{% endif %}
           placeholder="输入管理员密码" autocomplete="current-password" />

    {% if captcha_on %}
    <label for="captcha" style="margin-top:16px">验证码</label>
    <div class="cap-row">
      <input type="text" id="captcha" name="captcha" required autofocus
             maxlength="6" inputmode="text" autocapitalize="characters"
             autocomplete="off" spellcheck="false" placeholder="看右边" />
      <div class="cap-img" id="capBox" title="点一下换一张">
        <img id="capImg" src="/admin/captcha.svg" alt="验证码" />
        <div class="refresh">🔄 换一张</div>
      </div>
    </div>
    <p class="cap-hint">看不清?点图片换一张,3 分钟内有效</p>
    {% endif %}

    <button type="submit">开门!🚪</button>
  </form>
  <a class="back" href="/">← 回到我的小窝</a>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}?v={{ asset_ver }}"></script>
</body>
</html>
