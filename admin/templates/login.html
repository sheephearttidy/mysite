<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 我的小窝后台</title>
<meta name="theme-color" content="#fff8ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1c1a21" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ asset_ver }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/holidays.css') }}?v={{ asset_ver }}" />
<script nonce="{{ csp_nonce }}">
  // 尽早应用主题,避免深色模式闪白
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-theme-source',
        localStorage.getItem('theme') ? 'manual' : 'system');
    } catch (e) {}
  })();
</script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/holiday.js') }}?v={{ asset_ver }}"></script>
</head>
<body>
<span class="doodle d1">✨</span><span class="doodle d2">🔒</span>
<span class="doodle d3">⭐</span><span class="doodle d4">💫</span>
<button class="theme-btn" id="themeBtn" aria-label="切换深色模式" title="切换深色模式">
  <span class="ti-sun">☀️</span><span class="ti-moon">🌙</span>
</button>

<div class="card">
  <div class="lock">🔐</div>
  <h1>我的小窝 · 后台</h1>
  <p class="sub">只有主人才能进来的神秘领域</p>
  {% if get_flashed_messages() %}
  <div class="err{% if '分钟后再来' in get_flashed_messages()[0] %} blocked{% endif %}">
    {{ get_flashed_messages()[0] }}
  </div>
  {% endif %}
  {% if initial %}
  <div class="tip">
    🌱 首次使用:初始密码是 <b>admin</b>,<br />登录后会提醒你马上修改
  </div>
  {% endif %}
  <form method="post" id="loginForm">
    <label for="password">暗号(密码)</label>
    <input type="password" id="password" name="password" required
           {% if not captcha_on %}autofocus{% endif %}
           placeholder="输入管理员密码" autocomplete="current-password" />

    {% if captcha_on %}
    <label for="captcha" style="margin-top:16px">验证码</label>
    <div class="cap-row">
      <input type="text" id="captcha" name="captcha" required autofocus
             maxlength="6" inputmode="text" autocapitalize="characters"
             autocomplete="off" spellcheck="false" placeholder="看右边" />
      <div class="cap-img" id="capBox" title="点一下换一张">
        <img id="capImg" src="/admin/captcha.svg" alt="验证码" />
        <div class="refresh">🔄 换一张</div>
      </div>
    </div>
    <p class="cap-hint">看不清?点图片换一张,3 分钟内有效</p>
    {% endif %}

    <label for="totp" style="margin-top:16px">
      两步验证码 <span style="opacity:.6;font-weight:400">(未启用可留空)</span>
    </label>
    <input type="text" id="totp" name="totp" maxlength="6" inputmode="numeric"
           autocomplete="one-time-code" spellcheck="false"
           placeholder="6 位动态码(手机验证器)" />

    <button type="submit">开门!🚪</button>
  </form>
  <a class="back" href="/">← 回到我的小窝</a>
</div>

<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_ver }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/login.js') }}?v={{ asset_ver }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='js/holiday-fx.js') }}?v={{ asset_ver }}"></script>
</body>
</html>
