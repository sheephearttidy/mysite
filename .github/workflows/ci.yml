name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 语法检查(app.py / db.py / geo.py / 所有测试脚本)
        run: |
          python -m py_compile admin/app.py admin/db.py admin/geo.py admin/captcha.py
          for f in deploy/test_*.py deploy/verify_*.py; do
            python -m py_compile "$f" || echo "::warning::$f 编译失败"
          done

      - name: 前端资源一致性检查(7 页导航一致 + 资源引用存在)
        run: python deploy/ci_front_check.py

      - name: 上传检查结果
        if: always()
        run: echo "CI done"
